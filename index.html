<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página em Construção | Bitnix</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #212121;
      color: #f0f0f0;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .container {
      max-width: 600px;
      animation: fadeIn 1.2s ease-out;
    }

    h1 {
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 400;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    p {
      font-size: 15px;
      color: #999;
      line-height: 1.8;
      letter-spacing: 0.3px;
    }

    .line {
      width: 45px;
      height: 2px;
      background: #d4af37;
      margin: 30px auto;
      border-radius: 2px;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .container {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main class="container">
    <h1>Página em construção.</h1>
    <div class="line"></div>
    <p>Indisponibilidade por tempo indeterminado.</p>
  </main>

</body>

</html>
