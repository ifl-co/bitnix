<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitnix</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #212121;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* CURSOR CORE (menor e mais refinado) */
    .cursor-core {
      position: fixed;
      width: 3px;
      height: 3px;
      background: #ffd76a;
      border-radius: 50%;
      pointer-events: none;
      z-index: 10002;
      transform: translate(-50%, -50%);
      box-shadow:
        0 0 6px rgba(255, 215, 106, 0.9),
        0 0 14px rgba(255, 200, 80, 0.4);
    }

    /* RING suave (sem exagero) */
    .cursor-ring {
      position: fixed;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 10001;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255, 215, 106, 0.25);
      box-shadow: 0 0 12px rgba(255, 215, 106, 0.15);
    }

    /* TRAIL refinado */
    .trail {
      position: fixed;
      width: 6px;
      height: 6px;
      pointer-events: none;
      z-index: 9998;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 215, 106, 0.9) 0%, rgba(255, 215, 106, 0.4) 40%, transparent 70%);
      box-shadow:
        0 0 8px rgba(255, 215, 106, 0.6),
        0 0 18px rgba(255, 200, 80, 0.25);
      animation: trailFade 0.6s ease-out forwards;
    }

    @keyframes trailFade {
      to {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3);
      }
    }

    /* LOGO */
    .logo-container {
      position: relative;
      display: inline-block;
      animation: float 6s ease-in-out infinite;
      z-index: 2;
    }

    .logo {
      width: 600px;
      max-width: 90vw;
      filter: drop-shadow(0 0 20px rgba(255, 215, 106, 0.1));
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .logo-container:hover .logo {
      transform: scale(1.05);
      filter: drop-shadow(0 0 40px rgba(255, 215, 106, 0.3));
    }

    .logo-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 118%;
      height: 118%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 215, 106, 0.08), transparent 70%);
      animation: pulse 4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.3;
        transform: translate(-50%, -50%) scale(0.95);
      }
      50% {
        opacity: 0.7;
        transform: translate(-50%, -50%) scale(1.05);
      }
    }
  </style>
</head>

<body>

  <canvas id="bg"></canvas>

  <div class="cursor-core" id="cursorCore"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <div class="logo-container">
    <div class="logo-glow"></div>
    <img src="/img/bitnix-logo.png" alt="" class="logo">
  </div>

  <script>
    /* BACKGROUND */
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const amount = 80;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
    }

    window.addEventListener('resize', resize);

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.7) * 0.5;
        this.vy = (Math.random() - 0.7) * 0.5;
        this.size = Math.random() * 1.6 + 0.7;
      }

      move() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }

      draw() {
        ctx.fillStyle = 'rgba(130,130,130,0.18)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < amount; i++) {
        particles.push(new Particle());
      }
    }

    function connect() {
      for (let a = 0; a < particles.length; a++) {
        for (let b = a + 1; b < particles.length; b++) {
          const dx = particles[a].x - particles[b].x;
          const dy = particles[a].y - particles[b].y;
          const dist = dx * dx + dy * dy;

          if (dist < 10000) {
            ctx.strokeStyle = 'rgba(150,150,150,0.08)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particles[a].x, particles[a].y);
            ctx.lineTo(particles[b].x, particles[b].y);
            ctx.stroke();
          }
        }
      }
    }

    function animateBG() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        p.move();
        p.draw();
      });

      connect();
      requestAnimationFrame(animateBG);
    }

    resize();
    animateBG();

    /* CURSOR  */
    const core = document.getElementById('cursorCore');
    const ring = document.getElementById('cursorRing');

    let mouseX = 0;
    let mouseY = 0;
    let ringX = 0;
    let ringY = 0;

    document.addEventListener('mousemove', e => {
      mouseX = e.clientX;
      mouseY = e.clientY;

      core.style.left = mouseX + 'px';
      core.style.top = mouseY + 'px';

      createTrail(mouseX, mouseY);
    });

    function animateCursor() {
      ringX += (mouseX - ringX) * 0.2;
      ringY += (mouseY - ringY) * 0.2;

      ring.style.left = ringX + 'px';
      ring.style.top = ringY + 'px';

      requestAnimationFrame(animateCursor);
    }

    animateCursor();

    function createTrail(x, y) {
      const dot = document.createElement('div');
      dot.className = 'trail';

      dot.style.left = x + 'px';
      dot.style.top = y + 'px';

      document.body.appendChild(dot);

      setTimeout(() => dot.remove(), 600);
    }

    document.querySelectorAll('a,button,.logo').forEach(el => {
      el.addEventListener('mouseenter', () => {
        ring.style.transform = 'translate(-50%, -50%) scale(1.6)';
        ring.style.borderColor = 'rgba(255,215,106,0.5)';
      });

      el.addEventListener('mouseleave', () => {
        ring.style.transform = 'translate(-50%, -50%) scale(1)';
        ring.style.borderColor = 'rgba(255,215,106,0.25)';
      });
    });
  </script>

</body>

</html>
