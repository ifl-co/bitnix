<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitnix</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #212121;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .cursor-core {
      position: fixed;
      width: 3px;
      height: 3px;
      background: #ffd76a;
      border-radius: 50%;
      pointer-events: none;
      z-index: 10002;
      transform: translate(-50%, -50%);
      box-shadow:
        0 0 6px rgba(255, 215, 106, 0.9),
        0 0 14px rgba(255, 200, 80, 0.4);
    }

    .cursor-ring {
      position: fixed;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 10001;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255, 215, 106, 0.35);
      box-shadow: 0 0 10px rgba(255, 215, 106, 0.18);
    }

    .trail {
      position: fixed;
      width: 6px;
      height: 6px;
      pointer-events: none;
      z-index: 9998;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 215, 106, 0.9) 0%, rgba(255, 215, 106, 0.35) 45%, transparent 72%);
      box-shadow:
        0 0 8px rgba(255, 215, 106, 0.55),
        0 0 16px rgba(255, 200, 80, 0.25);
      animation: trailFade 0.55s ease-out forwards;
    }

    @keyframes trailFade {
      to {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.25);
      }
    }

    .logo-container {
      position: relative;
      display: inline-block;
      z-index: 2;
      animation: float 6s ease-in-out infinite;
      line-height: 0;
    }

    .logo {
      width: 360px;
      max-width: 78vw;
      display: block;
      filter:
        drop-shadow(0 0 2px rgba(255, 255, 255, 0.25))
        drop-shadow(0 0 5px rgba(255, 215, 106, 0.35))
        drop-shadow(0 0 12px rgba(255, 190, 55, 0.22));
      transition: transform 0.35s ease, filter 0.35s ease;
    }

    .logo-container:hover .logo {
      transform: scale(1.045);
      filter:
        drop-shadow(0 0 3px rgba(255, 255, 255, 0.35))
        drop-shadow(0 0 7px rgba(255, 215, 106, 0.48))
        drop-shadow(0 0 18px rgba(255, 190, 55, 0.32));
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>

<body>

  <canvas id="bg"></canvas>

  <div class="cursor-core" id="cursorCore"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <div class="logo-container">
    <img src="/mnt/data/0.png" alt="Bitnix Logo" class="logo">
  </div>

  <script>
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const amount = 80;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
    }

    window.addEventListener('resize', resize);

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.28;
        this.vy = (Math.random() - 0.5) * 0.28;
        this.size = Math.random() * 1.7 + 0.45;
        this.gold = Math.random() > 0.82;
      }

      move() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }

      draw() {
        ctx.fillStyle = this.gold
          ? 'rgba(255, 205, 86, 0.32)'
          : 'rgba(145, 145, 145, 0.26)';

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initParticles() {
      particles = [];

      for (let i = 0; i < amount; i++) {
        particles.push(new Particle());
      }
    }

    function connect() {
      for (let a = 0; a < particles.length; a++) {
        for (let b = a + 1; b < particles.length; b++) {
          const dx = particles[a].x - particles[b].x;
          const dy = particles[a].y - particles[b].y;
          const dist = dx * dx + dy * dy;

          if (dist < 11000) {
            const hasGold = particles[a].gold || particles[b].gold;

            ctx.strokeStyle = hasGold
              ? 'rgba(255, 205, 86, 0.09)'
              : 'rgba(150, 150, 150, 0.075)';

            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particles[a].x, particles[a].y);
            ctx.lineTo(particles[b].x, particles[b].y);
            ctx.stroke();
          }
        }
      }
    }

    function animateBG() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        p.move();
        p.draw();
      });

      connect();
      requestAnimationFrame(animateBG);
    }

    resize();
    animateBG();

    const core = document.getElementById('cursorCore');
    const ring = document.getElementById('cursorRing');

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let ringX = mouseX;
    let ringY = mouseY;

    document.addEventListener('mousemove', e => {
      mouseX = e.clientX;
      mouseY = e.clientY;

      core.style.left = mouseX + 'px';
      core.style.top = mouseY + 'px';

      createTrail(mouseX, mouseY);
    });

    function animateCursor() {
      ringX += (mouseX - ringX) * 0.22;
      ringY += (mouseY - ringY) * 0.22;

      ring.style.left = ringX + 'px';
      ring.style.top = ringY + 'px';

      requestAnimationFrame(animateCursor);
    }

    function createTrail(x, y) {
      const dot = document.createElement('div');
      dot.className = 'trail';
      dot.style.left = x + 'px';
      dot.style.top = y + 'px';

      document.body.appendChild(dot);

      setTimeout(() => {
        dot.remove();
      }, 550);
    }

    document.querySelectorAll('a, button, .logo').forEach(el => {
      el.addEventListener('mouseenter', () => {
        ring.style.width = '22px';
        ring.style.height = '22px';
        ring.style.borderColor = 'rgba(255, 215, 106, 0.62)';
      });

      el.addEventListener('mouseleave', () => {
        ring.style.width = '16px';
        ring.style.height = '16px';
        ring.style.borderColor = 'rgba(255, 215, 106, 0.35)';
      });
    });

    animateCursor();
  </script>

</body>

</html>
